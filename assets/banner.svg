<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.22;
      stroke-width: 1;
    }
    
    /* Subtle Dynamic Pulse Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes pulseOrb2 {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
    }
    @keyframes signalFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingDot {
      0% { r: 4px; opacity: 1; }
      70% { r: 10px; opacity: 0; }
      100% { r: 4px; opacity: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .dynamic-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .dynamic-orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .dynamic-path {
      stroke-dasharray: 8 8;
      animation: signalFlow 3s linear infinite;
    }
    .ping-circle {
      animation: pingDot 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .pill-anim-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-anim-2 {
      animation: floatPill 6s ease-in-out infinite 0.7s;
    }
    .pill-anim-3 {
      animation: floatPill 5.5s ease-in-out infinite 1.4s;
    }
    .pill-anim-4 {
      animation: floatPill 6.2s ease-in-out infinite 2.1s;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g>
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="120" y1="0" x2="120" y2="420" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="420" class="grid-line" />
    <line x1="360" y1="0" x2="360" y2="420" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="420" class="grid-line" />
    <line x1="840" y1="0" x2="840" y2="420" class="grid-line" />
    <line x1="960" y1="0" x2="960" y2="420" class="grid-line" />
    <line x1="1080" y1="0" x2="1080" y2="420" class="grid-line" />
  </g>

  <!-- Dynamic Glowing Background Orbs (Stay Strictly in Background) -->
  <circle cx="180" cy="110" r="130" fill="#6366f1" filter="url(#glow-filter)" class="dynamic-orb-1" opacity="0.4" />
  <circle cx="1020" cy="300" r="140" fill="#0ea5e9" filter="url(#glow-filter)" class="dynamic-orb-2" opacity="0.35" />
  <circle cx="850" cy="90" r="90" fill="#8b5cf6" filter="url(#glow-filter)" opacity="0.25" />

  <!-- Animated Data Connection Lines Behind Foreground Text -->
  <g opacity="0.45">
    <path d="M 60 380 Q 300 320 500 370 T 950 360 T 1140 330" fill="none" stroke="#38bdf8" stroke-width="2" class="dynamic-path" />
    <path d="M 80 50 Q 400 90 700 40 T 1120 70" fill="none" stroke="#a855f7" stroke-width="2" class="dynamic-path" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Meta (Never Obscured) -->
  <g transform="translate(80, 0)">
    
    <!-- Tagline Badge -->
    <g transform="translate(0, 68)">
      <rect width="365" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="15" cy="14" r="4" fill="#38bdf8" />
      <circle cx="15" cy="14" r="4" fill="#38bdf8" class="ping-circle" />
      <text x="28" y="19" class="tagline-text">CURATED INTELLIGENCE &amp; ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" class="title-text">
      Awesome Conversational Support &amp; ITSM
    </text>

    <!-- Gradient Bar Underline -->
    <rect x="0" y="174" width="620" height="4" rx="2" fill="url(#cyan-glow)" filter="url(#badge-glow)" />

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="222" class="subtitle-text">
      Production AI Service Desks, Slack-First Ticketing, Agent Assist &amp; Open-Source RAG
    </text>

    <!-- Interactive / Floating Feature Pills in Dedicated Bottom Foreground Space -->
    <g transform="translate(0, 275)">
      
      <!-- Pill 1: Agentic AI -->
      <g class="pill-anim-1" transform="translate(0, 0)">
        <rect width="215" height="48" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.3" />
        <circle cx="26" cy="24" r="10" fill="#0284c7" fill-opacity="0.4" />
        <text x="20" y="28" font-size="14" fill="#38bdf8">🤖</text>
        <text x="46" y="29" class="badge-text">Agentic IT Resolution</text>
      </g>

      <!-- Pill 2: Slack-First Ticketing -->
      <g class="pill-anim-2" transform="translate(235, 0)">
        <rect width="225" height="48" rx="24" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.3" />
        <circle cx="26" cy="24" r="10" fill="#4f46e5" fill-opacity="0.4" />
        <text x="20" y="28" font-size="14" fill="#818cf8">💬</text>
        <text x="46" y="29" class="badge-text">Slack-First Ticketing</text>
      </g>

      <!-- Pill 3: Self-Hosted RAG -->
      <g class="pill-anim-3" transform="translate(480, 0)">
        <rect width="235" height="48" rx="24" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.3" />
        <circle cx="26" cy="24" r="10" fill="#059669" fill-opacity="0.4" />
        <text x="20" y="28" font-size="14" fill="#34d399">⚡</text>
        <text x="46" y="29" class="badge-text">Self-Hosted RAG Agents</text>
      </g>

      <!-- Pill 4: Enterprise ITSM -->
      <g class="pill-anim-4" transform="translate(735, 0)">
        <rect width="265" height="48" rx="24" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.3" />
        <circle cx="26" cy="24" r="10" fill="#9333ea" fill-opacity="0.4" />
        <text x="20" y="28" font-size="14" fill="#c084fc">🛡️</text>
        <text x="46" y="29" class="badge-text">Enterprise Service Desks</text>
      </g>

    </g>

    <!-- Metadata Bottom Stats Bar -->
    <g transform="translate(0, 362)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        Updated November 2026 • SaaS Benchmarks with Pricing &amp; Limits • Verified Open-Source Star Rankings
      </text>
    </g>

  </g>
</svg>
